apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomato-clock
  labels:
    app.kubernetes.io/name: tomato-clock
    app.kubernetes.io/version: "0.4.0"
spec:
  # SQLite 使用一个写入进程；更新先关闭旧 Pod，再创建新 Pod。
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tomato-clock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tomato-clock
        app.kubernetes.io/version: "0.4.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tomato
          image: tomato-clock:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4187
          env:
            - name: PORT
              value: "4187"
            - name: BIND_ADDR
              value: "0.0.0.0"
            - name: DB_PATH
              value: "/data/tomato.db"
            - name: ALLOWED_HOSTS
              value: "tomato,tomato.tomato.svc.cluster.local"
            - name: GOMEMLIMIT
              value: "96MiB"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
          # 启动与存活探针只判断 HTTP 进程，数据库故障只摘流量，不重启进程。
          startupProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1"
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1"
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tomato-data
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
