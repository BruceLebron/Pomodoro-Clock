name: 检查番茄时钟
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  timer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 没有第三方依赖，无需 npm install。
      - run: npm test
      - run: node --check app.js
      - run: node --check timer-core.js
      - run: node --check scripts/serve.cjs
